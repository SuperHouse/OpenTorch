<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Torch R350 heater zones, cross-section seen from the front</title>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="449" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2937">Torch R350 heater zones</text>
  <text x="40" y="66" font-size="14" fill="#6b7280">Cross-section, seen from the front. Boards travel left to right.</text>

  <!-- chamber -->
  <rect x="90" y="95" width="820" height="255" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="80" y="160" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">Top</text>
  <text x="80" y="295" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">Bottom</text>

  <!-- column labels, top -->
  <g font-size="12" fill="#9ca3af" text-anchor="middle">
    <text x="148.6" y="130">T1</text>
    <text x="265.7" y="130">T2</text>
    <text x="382.9" y="130">T3</text>
    <text x="500.0" y="130">T4</text>
    <text x="734.3" y="130">over B5–B7</text>
  </g>

  <!-- top heaters: radiant plates -->
  <g fill="#D9480F">
    <rect x="100.0" y="140" width="97.1" height="30" rx="5"/>
    <rect x="217.1" y="140" width="97.1" height="30" rx="5"/>
    <rect x="334.3" y="140" width="97.1" height="30" rx="5"/>
    <rect x="451.4" y="140" width="97.1" height="30" rx="5"/>
  </g>
  <!-- zone 9: convection -->
  <rect x="568.6" y="140" width="331.4" height="30" rx="5" fill="#F59E0B"/>
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="590" cy="165" r="1.8"/><circle cx="604" cy="165" r="1.8"/><circle cx="618" cy="165" r="1.8"/>
    <circle cx="632" cy="165" r="1.8"/><circle cx="646" cy="165" r="1.8"/><circle cx="660" cy="165" r="1.8"/>
    <circle cx="808" cy="165" r="1.8"/><circle cx="822" cy="165" r="1.8"/><circle cx="836" cy="165" r="1.8"/>
    <circle cx="850" cy="165" r="1.8"/><circle cx="864" cy="165" r="1.8"/><circle cx="878" cy="165" r="1.8"/>
  </g>

  <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="148.6" y="160">Z1</text>
    <text x="265.7" y="160">Z3</text>
    <text x="382.9" y="160">Z5</text>
    <text x="500.0" y="160">Z7</text>
  </g>
  <text x="734.3" y="160" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">Z9 · convection</text>

  <!-- airflow into and out of zone 9 -->
  <g stroke="#B45309" stroke-width="2" fill="none">
    <line x1="640" y1="206" x2="640" y2="180" marker-end="url(#up)"/>
    <line x1="734" y1="206" x2="734" y2="180" marker-end="url(#up)"/>
    <line x1="828" y1="206" x2="828" y2="180" marker-end="url(#up)"/>
    <path d="M902,155 Q930,155 930,192" marker-end="url(#up)"/>
  </g>
  <text x="918" y="132" font-size="11" fill="#B45309">hot air out</text>
  <text x="918" y="146" font-size="11" fill="#B45309">at exit</text>

  <!-- conveyor -->
  <rect x="40" y="219" width="905" height="6" fill="#6b7280"/>
  <polygon points="945,212 968,222 945,232" fill="#6b7280"/>
  <text x="100" y="211" font-size="12" fill="#6b7280">Conveyor (mesh belt)</text>
  <text x="40" y="246" font-size="12" font-weight="600" fill="#4b5563">Entry</text>
  <text x="968" y="250" font-size="12" font-weight="600" fill="#4b5563" text-anchor="end">Exit</text>

  <!-- bottom heaters: radiant plates -->
  <g fill="#D9480F">
    <rect x="100.0" y="275" width="97.1" height="30" rx="5"/>
    <rect x="217.1" y="275" width="97.1" height="30" rx="5"/>
    <rect x="334.3" y="275" width="97.1" height="30" rx="5"/>
    <rect x="451.4" y="275" width="97.1" height="30" rx="5"/>
    <rect x="568.6" y="275" width="97.1" height="30" rx="5"/>
    <rect x="685.7" y="275" width="97.1" height="30" rx="5"/>
    <rect x="802.9" y="275" width="97.1" height="30" rx="5"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="148.6" y="295">Z2</text>
    <text x="265.7" y="295">Z4</text>
    <text x="382.9" y="295">Z6</text>
    <text x="500.0" y="295">Z8</text>
    <text x="617.1" y="295">Z10</text>
    <text x="734.3" y="295">Z11</text>
    <text x="851.4" y="295">Z12</text>
  </g>

  <!-- column labels, bottom -->
  <g font-size="12" fill="#9ca3af" text-anchor="middle">
    <text x="148.6" y="324">B1</text>
    <text x="265.7" y="324">B2</text>
    <text x="382.9" y="324">B3</text>
    <text x="500.0" y="324">B4</text>
    <text x="617.1" y="324">B5</text>
    <text x="734.3" y="324">B6</text>
    <text x="851.4" y="324">B7</text>
  </g>

  <!-- legend -->
  <rect x="90" y="378" width="16" height="12" rx="3" fill="#D9480F"/>
  <text x="114" y="389" font-size="13" fill="#374151">Radiant: ceramic infrared emitter plates (250 + 125 + 250 W per column)</text>
  <rect x="90" y="402" width="16" height="12" rx="3" fill="#F59E0B"/>
  <text x="114" y="413" font-size="13" fill="#374151">Convection: a fan draws air up through a perforated plate, over the heater, and out at the exit</text>
  <text x="114" y="434" font-size="12" fill="#6b7280">Each zone has its own control card (Modbus address 50 + zone number) and thermocouple. Zone 1 also switches the heater contactor.</text>
</svg>
