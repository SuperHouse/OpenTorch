# AIM M8 no-clean, SAC305 (the production paste). FIRST TRIAL, NOT VERIFIED.
#
# Target board profile (AIM lead-free profile supplement, no-clean column;
# Resources/aim-reflow-profile-supplement-lead-free.pdf):
#   ramp 1-3 °C/s; soak 150-200 °C for 30-90 s (RSS, optional);
#   time above liquidus (217 °C) 30-90 s; peak 230-250 °C;
#   40 °C to peak 3-4.5 min (180-270 s); cooling no faster than 4 °C/s.
#
# Starting point: the previous owner's last settings (found on the cards on
# 2026-10-28), with the belt 10 % faster. The untrusted screenshot
# "Loctite GC10 profile.PNG" has a shape that fits those settings. Measured
# with profile_report.py from a trace drawn from it: 150 to 200 °C in about
# 144 s, peak 252 °C, 278 s from 40 °C to peak, 78 s above liquidus. That is
# just outside the M8 window (soak too long, peak a little high, 40 °C to peak
# at the limit). A faster belt shortens all three. This is a guess: tune it
# with probe runs on T1 until the measured board curve is inside the window.
#
# Zone positions (entry -> exit): top Z1 Z3 Z5 Z7, Z9 (convection, over
# B5-B7); bottom Z2 Z4 Z6 Z8 Z10 Z11 Z12.

name = "AIM M8 SAC305 (trial 0)"

